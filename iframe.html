<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: rgb(30 30 30 / 90%); /* Set semi-transparent background */
    }
    #editor {
      border: none;
      box-sizing: border-box;
      color: white;
      font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      width: 100%;
      height: 100%;
      letter-spacing: 0.028px;
      line-height: 22.4px;
      overflow-wrap: break-word;
      tab-size: 4;
      text-size-adjust: 100%;
      white-space: pre-wrap;
      outline: none;
      background-color: transparent; /* Keep editor background transparent */
      padding: 5px 10px;
    }
    #editor[contenteditable="true"] {
      min-height: 100%;
    }
  </style>
</head>
<body>
  <div id="editor" contenteditable="true" autofocus></div>
  <script src="iframe.js"></script>
</body>
</html>
