<!DOCTYPE html>
<html>
<head>
  <style>
    /* CSS Reset to prevent inheritance from parent page */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* Force HTML and body isolation */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      font-family: Inter, 'Helvetica Neue', Arial, sans-serif !important;
      font-size: 14px !important;
      line-height: 22.4px !important;
      letter-spacing: 0.028px !important;
      color: white !important;
      background: rgb(30, 30, 30) !important;
      background-color: rgb(30, 30, 30) !important;
      overflow: hidden !important;
      /* Override any inherited CSS custom properties */
      --YLNNHc: white !important;
      --Xqboce: white !important;
      --EpFNW: #1f1f1f !important;
      --todMNcl: #202124 !important;
      --color: white !important;
      --background-color: rgb(30, 30, 30) !important;
    }
    
    /* 🎯 MAIN EDITOR - COMPLETE ISOLATION */
    #editor {
      width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      padding: 5px 10px !important;
      margin: 0 !important;
      border: none !important;
      outline: none !important;
      box-sizing: border-box !important;
      
      /* Force font properties */
      font-family: Inter, 'Helvetica Neue', Arial, sans-serif !important;
      font-size: 14px !important;
      line-height: 22.4px !important;
      letter-spacing: 0.028px !important;
      color: white !important;
      text-align: left !important;
      text-decoration: none !important;
      text-transform: none !important;
      font-weight: normal !important;
      font-style: normal !important;
      
      /* Force background */
      background: rgb(30, 30, 30) !important;
      background-color: rgb(30, 30, 30) !important;
      
      /* Force text properties */
      white-space: pre-wrap !important;
      overflow-wrap: break-word !important;
      word-wrap: break-word !important;
      tab-size: 4 !important;
      text-size-adjust: 100% !important;
      
      /* Override any CSS custom properties */
      --YLNNHc: white !important;
      --Xqboce: white !important;
      --EpFNW: #1f1f1f !important;
      --todMNcl: #202124 !important;
      --color: white !important;
      --background-color: rgb(30, 30, 30) !important;
    }
    
    #editor[contenteditable="true"] {
      min-height: 100% !important;
    }
    
    /* Override any inherited styles for text elements */
    #editor * {
      color: inherit !important;
      font-family: inherit !important;
      font-size: inherit !important;
      line-height: inherit !important;
    }
    
    /* Ensure links are visible */
    #editor a {
      color: #4CAF50 !important;
      text-decoration: underline !important;
    }
    
    /* Ensure bold text is visible */
    #editor b, #editor strong {
      font-weight: bold !important;
      color: white !important;
    }
    
    /* Ensure italic text is visible */
    #editor i, #editor em {
      font-style: italic !important;
      color: white !important;
    }
    
    /* Ensure underlined text is visible */
    #editor u {
      text-decoration: underline !important;
      color: white !important;
    }
    
    /* Ensure strikethrough text is visible */
    #editor s, #editor strike {
      text-decoration: line-through !important;
      color: white !important;
    }
    
    /* Ensure lists are properly styled */
    #editor ul, #editor ol {
      padding-left: 15px !important;
      margin: 0 !important;
      color: white !important;
    }
    
    #editor li {
      padding-left: 5px !important;
      margin: 0 !important;
      color: white !important;
    }
    
    /* Override any focus styles */
    #editor:focus {
      outline: none !important;
      color: white !important;
    }
    
    /* Ensure placeholder text is visible if any */
    #editor::placeholder {
      color: rgba(255, 255, 255, 0.7) !important;
    }
    
    /* 🎯 SYNC INDICATOR */
    #sync-indicator {
      position: fixed !important;
      top: 5px !important;
      right: 5px !important;
      width: 8px !important;
      height: 8px !important;
      border-radius: 50% !important;
      background-color: #4CAF50 !important;
      z-index: 10000 !important;
      transition: background-color 0.3s ease !important;
    }
  </style>
</head>
<body>
  <div id="editor" contenteditable="true"></div>
  <script src="iframe.js"></script>
</body>
</html>
